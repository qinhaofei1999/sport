name: iOS Build & TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS ipa and upload to TestFlight
    runs-on: macos-14
    defaults:
      run:
        working-directory: sport_app
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$ASC_API_KEY" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 -c "
          import json, os
          h = os.path.expanduser('~')
          key_id = os.environ['ASC_KEY_ID']
          issuer_id = os.environ['ASC_ISSUER_ID']
          with open(os.path.join(h, 'private_keys', 'AuthKey_%s.p8' % key_id)) as f:
              key = f.read()
          with open(os.path.join(h, 'private_keys', 'asc_key.json'), 'w') as f:
              json.dump({'key_id': key_id, 'issuer_id': issuer_id, 'key': key, 'in_house': False}, f)
          "
          echo "APP_STORE_CONNECT_API_KEY_PATH=$HOME/private_keys/asc_key.json" >> "$GITHUB_ENV"

      - name: Build Flutter iOS app (unsigned)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Sign and export ipa (fastlane match + gym)
        run: |
          cd ios
          fastlane beta

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f build/ios/ipa/Runner.ipa \
            -t ios \
            --apiKey ${ASC_KEY_ID} \
            --apiIssuer ${ASC_ISSUER_ID} \
            --verbose
