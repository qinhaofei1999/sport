<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SwimPose - 实时姿态分析</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; overflow: hidden; font-family: -apple-system, sans-serif;
    touch-action: none; position: fixed; width: 100%; height: 100%;
  }
  #container {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  video { display: none; }
  canvas {
    width: 100%; height: 100%; object-fit: contain;
  }
  #loading {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000; color: #fff; font-size: 18px; z-index: 10;
  }
  #loading .spinner {
    width: 40px; height: 40px; border: 3px solid #333;
    border-top-color: #00ff88; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #switch-btn {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
    color: #fff; border: 1px solid rgba(255,255,255,0.3);
    padding: 12px 28px; border-radius: 25px; font-size: 16px;
    z-index: 20; cursor: pointer; transition: background 0.2s;
  }
  #switch-btn:active { background: rgba(255,255,255,0.3); }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>加载模型中...</div>
</div>

<div id="container">
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<button id="switch-btn">翻转摄像头</button>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm/vision_bundle.js";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const loading = document.getElementById("loading");
let landmarker = null;
let stream = null;
let useFront = true;

const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task";

const SKELETON = [
  [11,12],[12,24],[24,23],[23,11],
  [11,13],[13,15],[12,14],[14,16],
  [23,25],[25,27],[27,29],[29,31],
  [24,26],[26,28],[28,30],[30,32],
];

function calcAngle(a, b, c) {
  const v1 = [a.x - b.x, a.y - b.y];
  const v2 = [c.x - b.x, c.y - b.y];
  const dot = v1[0]*v2[0] + v1[1]*v2[1];
  const norm = Math.sqrt(v1[0]**2 + v1[1]**2) * Math.sqrt(v2[0]**2 + v2[1]**2);
  if (norm === 0) return 0;
  return Math.acos(Math.max(-1, Math.min(1, dot / norm))) * 180 / Math.PI;
}

async function initModel() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm/"
  );
  landmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: MODEL_URL },
    runningMode: "LIVE_STREAM",
    numPoses: 1,
    minPoseDetectionConfidence: 0.5,
    minPosePresenceConfidence: 0.5,
    resultCallback: drawFrame,
  });
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: useFront ? "user" : "environment", width: { ideal: 640 }, height: { ideal: 480 } }
    });
    video.srcObject = stream;
    await video.play();
    loading.style.display = "none";
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    runLoop();
  } catch (e) {
    loading.innerHTML = `<div style="color:red">摄像头错误: ${e.message}</div>`;
  }
}

let lastTime = 0;

function runLoop() {
  if (video.readyState >= 2) {
    const now = performance.now();
    if (now - lastTime > 30) {
      landmarker.detectForVideo(video, now);
      lastTime = now;
    }
  }
  requestAnimationFrame(runLoop);
}

function drawFrame(result) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  if (!useFront) ctx.scale(-1, 1), ctx.translate(-canvas.width, 0);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();

  if (!result?.poseLandmarks?.length) return;
  const lm = result.poseLandmarks[0];
  const w = canvas.width, h = canvas.height;
  const pts = lm.map(p => ({ x: p.x * w, y: p.y * h }));

  ctx.save();
  if (!useFront) ctx.scale(-1, 1), ctx.translate(-w, 0);

  SKELETON.forEach(([i, j]) => {
    ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y);
    ctx.lineTo(pts[j].x, pts[j].y);
    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 2;
    ctx.stroke();
  });

  pts.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = "#ff3333"; ctx.fill();
  });

  ctx.restore();

  const kl = calcAngle(pts[23], pts[25], pts[27]);
  const kr = calcAngle(pts[24], pts[26], pts[28]);
  const al = calcAngle(pts[25], pts[27], pts[31]);
  const ar = calcAngle(pts[26], pts[28], pts[32]);

  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(8, 8, 180, 100);
  ctx.fillStyle = "#00ff88"; ctx.font = "bold 14px -apple-system";
  ctx.fillText(`膝 L: ${kl.toFixed(0)}  膝 R: ${kr.toFixed(0)}`, 16, 36);
  ctx.fillStyle = "#ffcc00";
  ctx.fillText(`踝 L: ${al.toFixed(0)}  踝 R: ${ar.toFixed(0)}`, 16, 58);
  ctx.fillStyle = "#aaa"; ctx.font = "12px -apple-system";
  ctx.fillText(`MediaPipe Pose | Lite`, 16, 80);
}

document.getElementById("switch-btn").addEventListener("click", () => {
  useFront = !useFront;
  startCamera();
});

await initModel();
startCamera();
</script>
</body>
</html>
